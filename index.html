<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="brain">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>brain</title>
<style>
  /* Everything inline and dependency-free: the app must render with no
     network at all, so there is nothing to fetch but the data itself. */
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b;
    --line: #272c37; --fg: #e6e8ee; --dim: #9aa3b2;
    --ok: #4ec9a0; --warn: #e0b341; --late: #e0674c; --link: #6fa8ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex; align-items: baseline; gap: 10px;
    padding: 18px 18px 10px; position: sticky; top: 0;
    background: linear-gradient(var(--bg) 70%, transparent);
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  .sub { color: var(--dim); font-size: 13px; }
  main { padding: 4px 14px 40px; max-width: 780px; margin: 0 auto; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 15px; margin: 10px 0; display: block; width: 100%;
    text-align: left; color: inherit; font: inherit; cursor: pointer;
  }
  .card:active { background: var(--panel-2); }
  .row { display: flex; align-items: center; gap: 10px; }
  .name { font-weight: 600; letter-spacing: .2px; flex: 1; }
  .age { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--dim); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
  .dot.late { background: var(--late); } .dot.never { background: var(--line); }
  .desc { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }

  button.act {
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 14px; font: inherit; font-size: 14px;
    cursor: pointer; margin: 4px 6px 0 0;
  }
  button.act:active { background: var(--line); }
  button.act[disabled] { opacity: .45; }

  #detail { display: none; }
  #detail.show { display: block; }
  #list.hide { display: none; }
  .back { color: var(--link); font-size: 14px; padding: 6px 0; display: inline-block; }

  .md h1, .md h2, .md h3 { line-height: 1.3; margin: 22px 0 8px; }
  .md h1 { font-size: 21px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; }
  .md p, .md li { color: #d3d8e2; }
  .md ul { padding-left: 20px; }
  .md a { color: var(--link); overflow-wrap: anywhere; }
  .md code { background: var(--panel-2); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
  .md pre { background: var(--panel-2); padding: 12px; border-radius: 10px; overflow-x: auto; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }

  .banner {
    background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--warn);
    border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: 13px; color: var(--dim);
  }
  input[type=password], input[type=text] {
    width: 100%; padding: 11px 12px; border-radius: 10px; font: inherit; font-size: 15px;
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); margin: 8px 0;
  }
  .setup { padding: 6px 2px; }
  .setup p { color: var(--dim); font-size: 14px; }
  code.k { color: var(--fg); }
</style>
</head>
<body>
<header><h1>brain</h1><span class="sub" id="hdr"></span></header>
<main>
  <div id="list"></div>
  <div id="detail"></div>
</main>

<script>
"use strict";

// ---- config ---------------------------------------------------------------
// The app shell is public; everything sensitive lives behind the token the
// user pastes in, which never leaves this device.
const OWNER = "lewis-steentjes";
const REPO  = "brain-state";
const API   = `https://api.github.com/repos/${OWNER}/${REPO}`;

const TOKEN_KEY = "brain.token";
const CACHE_KEY = "brain.cache";

const tok = () => localStorage.getItem(TOKEN_KEY) || "";

// Cache is what makes this readable with no network. Every successful fetch
// updates it; every failed one falls back to it and says so.
function cache(k, v) {
  const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}");
  if (v === undefined) return c[k];
  c[k] = v;
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); }
  catch (e) { /* quota: keep going with a live-only session */ }
  return v;
}

let OFFLINE = false;

async function gh(path, opts) {
  const r = await fetch(`${API}${path}`, Object.assign({
    headers: {
      Authorization: `Bearer ${tok()}`,
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    },
    cache: "no-store"
  }, opts || {}));
  if (r.status === 401 || r.status === 403) {
    const body = await r.text();
    throw Object.assign(new Error(`auth failed (${r.status})`), { auth: true, body });
  }
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r;
}

// GitHub returns file contents base64'd. atob yields a *binary* string, so the
// em-dashes and arrows all over the digests come out as mojibake unless the
// bytes are decoded as UTF-8 explicitly.
function b64utf8(b64) {
  const bin = atob(b64.replace(/\s/g, ""));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}

async function getJSON(path) {
  const key = `j:${path}`;
  try {
    const r = await gh(`/contents/${path}`);
    const j = await r.json();
    const v = JSON.parse(b64utf8(j.content));
    OFFLINE = false;
    return cache(key, v);
  } catch (e) {
    if (e.auth) throw e;
    const c = cache(key);
    if (c === undefined) throw e;
    OFFLINE = true;
    return c;
  }
}

async function getText(path) {
  const key = `t:${path}`;
  try {
    const r = await gh(`/contents/${path}`);
    const j = await r.json();
    const v = b64utf8(j.content);
    OFFLINE = false;
    return cache(key, v);
  } catch (e) {
    if (e.auth) throw e;
    const c = cache(key);
    if (c === undefined) throw e;
    OFFLINE = true;
    return c;
  }
}

async function listDir(path) {
  const key = `d:${path}`;
  try {
    const r = await gh(`/contents/${path}`);
    const v = (await r.json()).map(e => e.name);
    OFFLINE = false;
    return cache(key, v);
  } catch (e) {
    if (e.auth) throw e;
    const c = cache(key);
    if (c === undefined) return [];
    OFFLINE = true;
    return c;
  }
}

// ---- tiny markdown --------------------------------------------------------
// Deliberately small and offline. Handles what the roles actually emit:
// headings, lists, links, bold/italic, inline code, fences, rules.
function esc(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
// Link targets come from pages the digest/explore roles fetched, so they are
// untrusted input reaching an href. Only http(s) survives, and quotes are
// escaped so a crafted URL can't close the attribute and add handlers.
function safeUrl(u) {
  try {
    const p = new URL(u, location.href);
    if (p.protocol !== "http:" && p.protocol !== "https:") return null;
    return p.href.replace(/"/g, "%22");
  } catch (e) { return null; }
}
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) => {
      const safe = safeUrl(url);
      return safe
        ? `<a href="${safe}" target="_blank" rel="noopener noreferrer">${text}</a>`
        : text;
    })
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}
function md(src) {
  const out = [];
  let inList = false, inFence = false;
  const closeList = () => { if (inList) { out.push("</ul>"); inList = false; } };
  for (const line of String(src).split("\n")) {
    if (/^```/.test(line)) {
      closeList();
      out.push(inFence ? "</pre>" : "<pre>");
      inFence = !inFence;
      continue;
    }
    if (inFence) { out.push(esc(line)); continue; }
    if (/^\s*$/.test(line)) { closeList(); continue; }
    if (/^---+\s*$/.test(line)) { closeList(); out.push("<hr>"); continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    if (li) {
      if (!inList) { out.push("<ul>"); inList = true; }
      out.push(`<li>${inline(li[1])}</li>`);
      continue;
    }
    closeList();
    out.push(`<p>${inline(line)}</p>`);
  }
  closeList();
  if (inFence) out.push("</pre>");
  return out.join("\n");
}

// ---- staleness ------------------------------------------------------------
const DAY = 86400000;
const today = () => new Date().toLocaleDateString("en-CA", { timeZone: "Pacific/Auckland" });
function ageDays(dateStr) {
  if (!dateStr) return null;
  return Math.floor((Date.parse(today()) - Date.parse(dateStr)) / DAY);
}
function state(age, cadence) {
  if (age === null) return "never";
  if (age <= cadence) return "ok";
  if (age <= cadence * 2) return "warn";
  return "late";
}
function ageLabel(age) {
  if (age === null) return "never run";
  if (age === 0) return "today";
  if (age === 1) return "yesterday";
  return `${age} days ago`;
}

// ---- views ----------------------------------------------------------------
const $list = document.getElementById("list");
const $detail = document.getElementById("detail");
const $hdr = document.getElementById("hdr");

function showSetup(msg) {
  $list.className = "hide";
  $detail.className = "show";
  $detail.innerHTML = `
    <div class="setup">
      <h2>Connect</h2>
      ${msg ? `<div class="banner">${esc(msg)}</div>` : ""}
      <p>Paste a fine-grained personal access token scoped to
      <code class="k">${OWNER}/${REPO}</code>. It is stored on this device only
      and sent straight to GitHub.</p>
      <p>Permissions: <strong>Contents: read</strong> to view,
      plus <strong>Actions: read and write</strong> to trigger runs.</p>
      <input type="password" id="tokin" placeholder="github_pat_..." autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="act" id="savetok">Save</button>
    </div>`;
  document.getElementById("savetok").onclick = () => {
    const v = document.getElementById("tokin").value.trim();
    if (!v) return;
    localStorage.setItem(TOKEN_KEY, v);
    $detail.className = ""; $list.className = "";
    home();
  };
}

async function home() {
  $detail.className = ""; $detail.innerHTML = "";
  $list.className = "";
  if (!tok()) return showSetup();

  $list.innerHTML = `<div class="desc">Loading…</div>`;
  let roles, runs;
  try {
    roles = await getJSON("roles.json");
    runs = await listDir("runs");
  } catch (e) {
    if (e.auth) return showSetup("That token was rejected. Check it has Contents: read on the repo, and hasn't expired.");
    $list.innerHTML = `<div class="banner">Couldn't load, and nothing cached yet: ${esc(e.message)}</div>`;
    return;
  }

  // runs/ is named <date>-<role>.json, so the newest run per role is a pure
  // filename parse — no extra requests to work out what is stale.
  const last = {};
  for (const f of runs) {
    const m = f.match(/^(\d{4}-\d{2}-\d{2})-(.+)\.json$/);
    if (!m) continue;
    if (!last[m[2]] || m[1] > last[m[2]]) last[m[2]] = m[1];
  }

  const wired = Object.entries(roles)
    .filter(([k, v]) => v && typeof v === "object" && v.workflow)
    .sort((a, b) => a[1].cadence_days - b[1].cadence_days || a[0].localeCompare(b[0]));

  $hdr.textContent = OFFLINE ? "cached" : today();

  $list.innerHTML = wired.map(([name, r]) => {
    const age = ageDays(last[name]);
    const st = state(age, r.cadence_days);
    return `
      <button class="card" data-role="${esc(name)}">
        <div class="row">
          <span class="dot ${st}"></span>
          <span class="name">${esc(name)}</span>
          <span class="age">${ageLabel(age)}</span>
        </div>
        <div class="desc">${esc(r.summary || "")}</div>
        <div class="meta">every ${r.cadence_days}d${last[name] ? " · last " + last[name] : ""}</div>
      </button>`;
  }).join("") + (OFFLINE
      ? `<div class="banner">Offline — showing the last data this device fetched.</div>` : "");

  for (const b of $list.querySelectorAll(".card")) {
    b.onclick = () => detail(b.dataset.role, roles[b.dataset.role], last[b.dataset.role]);
  }
}

async function detail(name, role, lastDate) {
  $list.className = "hide";
  $detail.className = "show";
  $detail.innerHTML = `<a class="back" id="back">‹ back</a><h2>${esc(name)}</h2><div class="desc">Loading…</div>`;
  document.getElementById("back").onclick = home;

  const dir = role.output && role.output.dir;
  let bodyHtml = "";

  if (role.output && role.output.by === "date" && dir) {
    // Newest dated file in the role's output dir — not necessarily lastDate,
    // since a coach briefing can collide and land as <date>-2.md.
    const files = (await listDir(dir)).filter(f => f.endsWith(".md")).sort();
    const newest = files[files.length - 1];
    bodyHtml = newest
      ? `<div class="md">${md(await getText(`${dir}/${newest}`))}</div>`
      : `<div class="banner">No output filed yet.</div>`;
  } else {
    bodyHtml = `<div class="banner">This role writes into <code>${esc(dir || "state")}</code> rather than filing a dated document. Its last run is recorded below.</div>`;
  }

  let recHtml = "";
  if (lastDate) {
    try {
      const rec = await getJSON(`runs/${lastDate}-${name}.json`);
      const secs = rec.duration_ms ? (rec.duration_ms / 1000).toFixed(0) + "s" : "?";
      recHtml = `<div class="meta">last run ${esc(rec.date)} · ${secs} · ${rec.num_turns ?? "?"} turns · $${(rec.cost_usd ?? 0).toFixed(2)}</div>`;
    } catch (e) { /* record is a nicety, not the point */ }
  }

  $detail.innerHTML = `
    <a class="back" id="back2">‹ back</a>
    <h2>${esc(name)}</h2>
    ${recHtml}
    <button class="act" id="runnow">Run now</button>
    <div id="runmsg" class="meta"></div>
    ${bodyHtml}`;
  document.getElementById("back2").onclick = home;
  document.getElementById("runnow").onclick = () => dispatch(name, role);
}

async function dispatch(name, role) {
  const btn = document.getElementById("runnow");
  const msg = document.getElementById("runmsg");
  btn.disabled = true;
  msg.textContent = "Requesting…";
  try {
    await gh(`/actions/workflows/${role.workflow}/dispatches`, {
      method: "POST",
      body: JSON.stringify({ ref: "main" })
    });
    // Dispatch is fire-and-forget by design: a run takes minutes, so the
    // answer arrives on a later open rather than in this session.
    msg.textContent = "Queued. It takes a few minutes — check back shortly.";
  } catch (e) {
    btn.disabled = false;
    msg.textContent = e.auth
      ? "Rejected — the token needs Actions: read and write to trigger runs."
      : `Failed: ${e.message}`;
  }
}

// ---- boot -----------------------------------------------------------------
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
home();
</script>
</body>
</html>
